<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7466">
<meta name="description" content="배우고 싶은 언어로 천천히 말 걸어 주는 AI 친구">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회화 친구">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>AI 회화 친구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one phone-height column — friend header, 4-step strip, chat that scrolls, mic dock pinned at the bottom. */
:root{
  --bg:#E8EFED; --surface:#FFFFFF; --surface-2:#D9E6E2; --ink:#16302B; --muted:#5A6E69;
  --accent:#0E7466; --accent-ink:#FFFFFF; --sun:#F6C653; --sun-soft:#FCEFC7; --sun-ink:#3A2A00;
  --line:#C6D6D1; --warn:#B4442F; --face:#FFD8A6; --face-line:#2A2320; --cheek:#F3A08F;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1715; --surface:#17221F; --surface-2:#1F2E2A; --ink:#E2EEEA; --muted:#92A8A2;
  --accent:#46C1AD; --accent-ink:#04201B; --sun:#E3B446; --sun-soft:#3A3117; --sun-ink:#2A1E00;
  --line:#2A3B36; --warn:#E5806B; --face:#E8BF8E; --face-line:#2A2320; --cheek:#CF7F6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#17221F; --surface-2:#1F2E2A; --ink:#E2EEEA; --muted:#92A8A2;
  --accent:#46C1AD; --accent-ink:#04201B; --sun:#E3B446; --sun-soft:#3A3117; --sun-ink:#2A1E00;
  --line:#2A3B36; --warn:#E5806B; --face:#E8BF8E; --face-line:#2A2320; --cheek:#CF7F6E; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.face{width:56px;height:56px;flex:none}
.who{flex:1;min-width:0}
.who h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;text-wrap:balance}
.status{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.wrapbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;flex:none}

/* 4-step strip */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-bottom:8px}
.step{font-size:12px;text-align:center;padding:4px 0;border-radius:6px;color:var(--muted);background:transparent;border-bottom:3px solid var(--line);letter-spacing:.02em}
.step.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.timer{font-variant-numeric:tabular-nums}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:8px 16px;scroll-behavior:smooth}
.msg{max-width:88%;border-radius:18px;padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-top-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--surface-2);border-top-right-radius:6px}
.me .tag{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;letter-spacing:.03em}
.say{font-size:22px;line-height:1.35}
.ko{font-size:14px;color:var(--muted);margin-top:4px}
.hide-ko .ko{display:none}
.hide-ko .msg.showko .ko{display:block}
.tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.chip svg{width:14px;height:14px}
.repeat{margin-top:10px;background:var(--sun-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cue{font-size:13px;color:var(--ink)}
.rt{font-size:21px;line-height:1.35}
.rko{font-size:13px;color:var(--muted)}
.hide-ko .rko{display:none}
.hide-ko .msg.showko .rko{display:block}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn-sun{background:var(--sun);color:var(--sun-ink);border:0;border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;font-weight:700}
.btn-sun svg{width:16px;height:16px}
.veiled .say,.veiled .rt{filter:blur(7px);user-select:none}
.veiled .ko,.veiled .rko{visibility:hidden}
.veilnote{display:none;font-size:12px;color:var(--muted);margin-top:6px}
.veiled .veilnote{display:block}
.thinking{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;gap:5px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.note{align-self:center;font-size:13px;color:var(--muted);text-align:center;max-width:90%}
.note.err{color:var(--warn)}

/* intro card */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.intro .bigface{width:96px;height:96px;align-self:center}
.intro h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;text-align:center;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:15px;text-align:center}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding:0;list-style:none}
.flow li{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.flow b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--ink)}
.btn-main{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700}
.btn-main:disabled{opacity:.5;cursor:default}
.conn{font-size:13px;color:var(--muted);text-align:center}
.conn.err{color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}

/* wrap-up card */
.wrapcard{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.wrapcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.sent{display:flex;gap:10px;align-items:flex-start;padding-block:6px;border-top:1px solid var(--line)}
.sent:first-of-type{border-top:0}
.sent div{flex:1;min-width:0}
.sent .t{font-size:19px;line-height:1.35}
.sent .k{font-size:13px;color:var(--muted)}
.wrapcard textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:18px;resize:vertical}
.fix{background:var(--sun-soft);border-radius:12px;padding:10px 12px}
.fix .t{font-size:19px}

/* dock */
.dock{padding-block:8px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.typerow{display:flex;gap:8px}
.typerow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-size:16px}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.microw{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);justify-self:start}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px -8px var(--accent);position:relative}
.mic svg{width:32px;height:32px}
.mic.on{background:var(--warn)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(.95);opacity:1}100%{transform:scale(1.15);opacity:0}}
.mic:disabled{opacity:.45;cursor:default}
.hint{justify-self:end;font-size:12px;color:var(--muted);text-align:right;max-width:110px}

/* avatar */
.face .eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.face .mouth-talk{opacity:0}
.talking .face .mouth-rest{opacity:0}
.talking .face .mouth-talk{opacity:1;transform-origin:center;transform-box:fill-box;animation:talk .28s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.listening .face .ear-dot{opacity:1}
.face .ear-dot{opacity:0;transition:opacity .2s}

/* settings sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.sheet h3{margin:6px 0 0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.small{font-size:13px;color:var(--muted);margin:0}
.small a{color:var(--accent)}
.sheet .row{display:flex;gap:10px}
.sheet .row button{flex:1}
.btn-ghost{border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px;font-size:15px}
.btn-ghost.danger{color:var(--warn);border-color:var(--warn)}
.ratev{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media (max-width:360px){.say{font-size:20px}.mic{width:68px;height:68px}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <svg class="face" id="face" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="52" r="42" fill="var(--face)"/>
      <path d="M14 40 C18 14, 82 14, 86 40 C76 28, 60 24, 50 30 C40 24, 24 28, 14 40Z" fill="var(--accent)"/>
      <circle class="ear-dot" cx="10" cy="54" r="5" fill="var(--sun)"/>
      <circle class="ear-dot" cx="90" cy="54" r="5" fill="var(--sun)"/>
      <ellipse class="eye" cx="36" cy="52" rx="4.5" ry="5.5" fill="var(--face-line)"/>
      <ellipse class="eye" cx="64" cy="52" rx="4.5" ry="5.5" fill="var(--face-line)"/>
      <circle cx="27" cy="64" r="6" fill="var(--cheek)" opacity=".6"/>
      <circle cx="73" cy="64" r="6" fill="var(--cheek)" opacity=".6"/>
      <path class="mouth-rest" d="M41 68 Q50 76 59 68" fill="none" stroke="var(--face-line)" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse class="mouth-talk" cx="50" cy="70" rx="7" ry="6" fill="var(--face-line)"/>
    </svg>
    <div class="who">
      <h1 id="fname">Emma</h1>
      <div class="status" id="status">영어 친구 · 천천히 말해요</div>
    </div>
    <button class="wrapbtn" id="wrapBtn" type="button" hidden>마무리</button>
    <button class="iconbtn" id="setBtn" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <nav class="steps" aria-label="학습 단계">
    <div class="step" data-step="listen">① 듣기</div>
    <div class="step" data-step="speak">② 말하기</div>
    <div class="step" data-step="read">③ 읽기</div>
    <div class="step" data-step="write">④ 쓰기</div>
  </nav>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="dock" id="dock" hidden>
    <form class="typerow" id="typeForm">
      <input id="typeIn" type="text" autocomplete="off" placeholder="한국어로 써도 돼요" aria-label="내 대답">
      <button class="send" type="submit" aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="microw">
      <div class="seg" role="group" aria-label="말할 언어">
        <button type="button" id="segKo" aria-pressed="true">한국어</button>
        <button type="button" id="segTg" aria-pressed="false">영어</button>
      </div>
      <button class="mic" id="micBtn" type="button" aria-label="눌러서 말하기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="hint" id="micHint">누르고 말해요</div>
    </div>
  </footer>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <form class="sheet" id="sheet" aria-label="설정">
    <h2>내 사용설명서</h2>
    <div class="grid2">
      <div class="field"><label for="s_who">나는</label><select id="s_who"><option>성인</option><option>아이</option></select></div>
      <div class="field"><label for="s_age">나이</label><input id="s_age" type="number" min="3" max="99" inputmode="numeric"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="s_lang">배울 언어</label><select id="s_lang"></select></div>
      <div class="field"><label for="s_level">지금 수준</label><select id="s_level"><option>완전 처음</option><option>단어 몇 개 앎</option><option>짧은 대화 됨</option><option>일상 대화 됨</option></select></div>
    </div>
    <div class="field"><label for="s_likes">좋아하는 것</label><input id="s_likes" type="text" placeholder="축구, 요리, 여행, 게임, 기차"></div>
    <div class="grid2">
      <div class="field"><label for="s_friend">친구 이름</label><input id="s_friend" type="text"></div>
      <div class="field"><label for="s_persona">친구 성격</label><input id="s_persona" type="text"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="s_repeat">따라 말하기</label><select id="s_repeat"><option>적게</option><option>보통</option><option>많이</option></select></div>
      <div class="field"><label for="s_min">하루에 쓸 시간(분)</label><input id="s_min" type="number" min="1" max="120" inputmode="numeric"></div>
    </div>

    <h3>소리와 글자</h3>
    <div class="field"><label for="s_rate">말 속도 <span class="ratev" id="rateV">0.88</span>배</label><input id="s_rate" type="range" min="0.6" max="1.1" step="0.02"></div>
    <label class="check"><input id="s_sound" type="checkbox"> 소리 먼저 듣고, 글자는 뒤에 보기</label>
    <label class="check"><input id="s_ko" type="checkbox"> 한국어 뜻 보이기</label>

    <h3>AI 연결</h3>
    <p class="small" id="connClaude" hidden>Claude 계정으로 연결돼요. 처음 말을 걸 때 한 번 허용할지 물어봐요. 키는 필요 없어요.</p>
    <div id="connGemini" hidden>
      <div class="field"><label for="s_key">Gemini API 키</label><input id="s_key" type="password" autocomplete="off" placeholder="AIza…"></div>
      <div class="field" style="margin-top:10px"><label for="s_model">모델 이름</label><input id="s_model" type="text"></div>
      <p class="small" style="margin-top:8px">무료 키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 받아요. 키는 이 기기에만 저장되고 파일 안에는 들어가지 않아요. 결제 계정에는 한 달 사용 한도를 걸어 두세요.</p>
    </div>

    <h3>대화 기록</h3>
    <p class="small">기록은 이 기기 안에만 저장돼요.</p>
    <button class="btn-ghost danger" type="button" id="clearBtn">기록 지우고 새로 시작</button>
    <p class="small">앱 버전 1.0.0 · 인터넷에 연결돼 있으면 열 때마다 새 버전을 받아요.</p>

    <div class="row">
      <button class="btn-ghost" type="button" id="cancelBtn">닫기</button>
      <button class="btn-main" type="submit">저장</button>
    </div>
  </form>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const LANGS = {"영어":"en-US","일본어":"ja-JP","중국어":"zh-CN","스페인어":"es-ES","프랑스어":"fr-FR","독일어":"de-DE","베트남어":"vi-VN"};
const DEFAULTS = {who:"성인",age:"35",lang:"영어",level:"단어 몇 개 앎",likes:"여행, 요리",minutes:"15",friend:"Emma",persona:"차분하고 다정함",repeatAmt:"보통",rate:0.88,showKo:true,soundFirst:true,apiKey:"",model:"gemini-2.5-flash"};

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let S = Object.assign({}, DEFAULTS, store.get("kf.settings", {}));

- "(대화 시작)"이 오면 네가 먼저 짧게 인사하고, 오늘 하루가 어땠는지 하나만 물어봐.`;

function turnsFromLog(){
  const out = [];
  for (const x of log){
    if (x.who === "me") out.push({role:"user", content:(x.tag ? `[${x.tag}] ` : "") + x.text});
    else if (x.who === "ai") out.push({role:"assistant", content:JSON.stringify({say:x.say, ko:x.ko, repeat:x.repeat||"", repeat_ko:x.repeat_ko||""})});
  }
  return out.slice(-24);
}
function parseJSON(text){
  let t = String(text||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b+1)); } catch(e){} }
  throw {code:"invalid_json"};
}
async function ask(sys, msgs){
  if (provider === null && detecting) await detecting;
  if (msgs.length && msgs[0].role !== "user") msgs = [{role:"user",content:"(대화 이어서)"}, ...msgs];
  if (provider === "claude"){
    return await sampleFn.json([{role:"user", content:sys}, ...msgs], {modelTier:"quick", cache:false});
  }
  if (provider !== "gemini") throw {code:"no_provider"};
  if (!S.apiKey) throw {code:"no_key"};
  const merged = [];
  for (const m of msgs){
    const role = m.role === "assistant" ? "model" : "user";
    const last = merged[merged.length-1];
    if (last && last.role === role) last.parts[0].text += "\n" + m.content;
    else merged.push({role, parts:[{text:m.content}]});
  }
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent`, {
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":S.apiKey},
      body: JSON.stringify({systemInstruction:{parts:[{text:sys}]}, contents:merged, generationConfig:{responseMimeType:"application/json", temperature:0.8}})
    });
  } catch(e){ throw {code:"network"}; }
  if (!res.ok){
    let m = ""; try { m = (await res.json()).error?.message || ""; } catch(e){}
    throw {code:"http", status:res.status, message:m};
  }
  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  return parseJSON(text);
}
function errText(e){
  const c = e && e.code;
  if (c === "no_key") return "설정에서 Gemini API 키를 넣어 주세요.";
  if (c === "no_provider") return "이 화면에서는 AI에 연결할 수 없어요. 파일로 받아 크롬에서 열어 주세요.";
  if (c === "not_granted") return "Claude 사용을 허용하지 않아서 대답할 수 없어요. 페이지를 다시 열면 다시 물어봐요.";
  if (c === "rate_limited") return "잠깐 너무 많이 물어봤어요. 조금 있다 다시 보내 주세요.";
  if (c === "session_expired") return "Claude에 다시 로그인해 주세요.";
  if (c === "network") return "인터넷 연결을 확인해 주세요.";
  if (c === "http" && (e.status === 400 || e.status === 403)) return "API 키나 모델 이름을 확인해 주세요. " + (e.message||"");
  if (c === "http" && e.status === 429) return "오늘 무료 사용량을 다 썼거나 너무 빨리 보냈어요. 잠시 뒤에 다시 해 주세요.";
  if (c === "invalid_json") return "대답을 읽지 못했어요. 한 번 더 보내 주세요.";
  return "대답을 받지 못했어요. 한 번 더 보내 주세요.";
}

/* ---------- speech out ---------- */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch(e){ voices = []; } }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(code){
  const base = code.split("-")[0];
  const norm = v => v.lang.replace("_","-");
  const list = voices.filter(v => norm(v).toLowerCase().startsWith(base));
  return list.find(v => norm(v) === code && /natural|google|siri|premium|enhanced/i.test(v.name))
      || list.find(v => norm(v) === code) || list[0] || null;
}
function speak(text, code){
  return new Promise(resolve => {
    if (!text || !("speechSynthesis" in window)) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code; u.rate = Number(S.rate) || 0.88;
    const v = pickVoice(code); if (v) u.voice = v;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(t); $("#app").classList.remove("talking"); resolve(); };
    const t = setTimeout(fin, 2500 + text.length * 140);
    u.onend = fin; u.onerror = fin;
    $("#app").classList.add("talking");
    try { speechSynthesis.speak(u); } catch(e){ fin(); }
  });
}
function stopSpeaking(){ try { speechSynthesis.cancel(); } catch(e){} $("#app").classList.remove("talking"); }
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- speech in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micBlocked = !SR || !!window.claude;
function micHint(t){ $("#micHint").textContent = t; }
function listen(code, onFinal){
  if (micBlocked){ micHint("마이크를 못 써요. 키보드의 마이크로 말해요"); $("#typeIn").focus(); return; }
  if (rec){ rec.stop(); return; }
  stopSpeaking();
  let finalText = "", gotError = false;
  try {
    rec = new SR();
    rec.lang = code; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  } catch(e){ micBlocked = true; micHint("마이크를 못 써요. 글로 써 주세요"); return; }
  rec.onresult = ev => {
    let interim = ""; finalText = "";
    for (const r of ev.results){ if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    $("#typeIn").value = finalText || interim;
  };
  rec.onerror = ev => {
    gotError = true;
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture"){
      micBlocked = true; micHint("마이크가 막혀 있어요. 키보드의 마이크나 글로 해요");
    } else if (ev.error === "no-speech") micHint("소리가 안 들렸어요. 다시 눌러요");
    else micHint("다시 눌러 말해요");
  };
  rec.onend = () => {
    rec = null;
    $("#micBtn").classList.remove("on"); $("#app").classList.remove("listening");
    const t = (finalText || $("#typeIn").value).trim();
    if (t && !gotError){ $("#typeIn").value = ""; onFinal(t); }
    else if (!gotError) micHint("누르고 말해요");
    if (!busy) idleStatus();
  };
  try {
    rec.start();
    $("#micBtn").classList.add("on"); $("#app").classList.add("listening");
    setStep("speak"); setStatus("듣고 있어요… 다 말하면 멈춰요"); micHint("다시 누르면 끝");
  } catch(e){ rec = null; micBlocked = true; micHint("마이크를 못 써요. 글로 써 주세요"); }
}

async function getReply(){

    th.remove();
    const x = {who:"ai", say:String(r.say||"").trim(), ko:String(r.ko||"").trim(), repeat:String(r.repeat||"").trim(), repeat_ko:String(r.repeat_ko||"").trim()};
    if (!x.say && !x.repeat) throw {code:"invalid_json"};

  if (!text || busy || wrapped) return;
  stopSpeaking();
  if (!tag) tag = /[가-힣]/.test(text) ? "한국어로 말함" : `${S.lang}로 말함`;
  const x = {who:"me", text, tag};
  log.push(x); saveLog();
  chat.append(meBubble(x)); scrollEnd();
  if (tag === "따라 말함"){ micLang = "ko"; syncSeg(); }
  getReply();
}
function start(){
  // unlock audio on iOS/Safari with a user gesture
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
  started = true;
  log.push({who:"me", text:"(대화 시작)", tag:"", hidden:true}); saveLog();
  renderAll();
  getReply();
}
async function wrapUp(auto){
  if (wrapped || busy) return;
  stopSpeaking(); if (rec) rec.stop();
  const lines = log.filter(x => !x.hidden && (x.who === "me" || x.who === "ai"))
    .map(x => x.who === "me" ? `나: ${x.text}` : `${S.friend}: ${x.say}${x.repeat ? " / 따라 말하기: " + x.repeat : ""}`).join("\n");
  if (!lines){ note("아직 나눈 이야기가 없어요."); return; }
  busy = true; $("#micBtn").disabled = true; setStatus("오늘 문장을 모으는 중…");
  if (auto) note(`오늘 쓸 시간 ${S.minutes}분이 다 됐어요. 마무리해요.`);
  const th = thinking();
  const sys = `${profileText()}

너는 ${S.lang} 회화 친구 ${S.friend}야. 아래는 오늘 나눈 대화야. 오늘 같이 쓴 ${S.lang} 문장 중에서 다시 써 보기 좋은 짧은 문장을 3개까지 골라 줘(사용자 수준에 맞게, 따라 말하기 문장 우선). 그리고 그중 하나를 써 보라고 한국어로 다정하게 한 문장 말해 줘.
다른 글 없이 JSON 하나만: {"sentences":[{"t":"${S.lang} 문장","ko":"한국어 뜻"}],"ask_ko":"한국어 한 문장"}`;
  try {
    const r = await ask(sys, [{role:"user", content:lines}]);
    th.remove();
    const x = {who:"wrap", sentences:(Array.isArray(r.sentences) ? r.sentences : []).slice(0,3).map(s => ({t:String(s.t||""), ko:String(s.ko||"")})).filter(s => s.t), ask_ko:String(r.ask_ko||"")};
    log.push(x); saveLog(); wrapped = true;
    renderAll(); setStep("write"); setStatus("오늘 문장 하나 써 보기");
  } catch(e){
    th.remove(); note(errText(e), true); idleStatus();
  } finally { busy = false; $("#micBtn").disabled = false; }
}
async function checkWriting(text, button){
  text = String(text||"").trim();
  if (!text){ $("#writeBox").focus(); return; }
  button.disabled = true; button.textContent = "보는 중…";
  const sys = `${profileText()}

너는 ${S.lang} 회화 친구 ${S.friend}야. 사용자가 오늘 배운 ${S.lang} 문장을 써 봤어. 부드럽게 봐 줘.
- 맞으면 same=true, fixed는 원문 그대로.
- 틀린 곳이 있으면 same=false, fixed에 자연스럽게 고친 문장 하나만. 문법 설명이나 점수는 쓰지 마.
- say_ko: 한국어로 짧고 따뜻한 한 마디(칭찬 한 단어 + 필요하면 "이렇게 쓰면 더 자연스러워").
다른 글 없이 JSON 하나만: {"same":true,"fixed":"...","say_ko":"..."}`;
  try {
    const r = await ask(sys, [{role:"user", content:text}]);
    const x = {who:"fix", same:!!r.same, fixed:String(r.fixed||""), say_ko:String(r.say_ko||"")};
    log.push({who:"me", text, tag:"써 봤어요"}); log.push(x); saveLog();
    renderAll();
    if (x.fixed) speak(x.fixed, tgCode());
  } catch(e){
    button.disabled = false; button.textContent = "다 썼어요";
    note(errText(e), true);
  }
}
function resetAll(){
  stopSpeaking(); if (rec) rec.stop();
  log = []; store.del("kf.log"); started = false; wrapped = false; micLang = "ko"; syncSeg();
  renderAll(); idleStatus();
}

/* ---------- dock ---------- */
function syncSeg(){
  $("#segTg").textContent = S.lang;
  $("#segKo").setAttribute("aria-pressed", micLang === "ko" ? "true" : "false");
  $("#segTg").setAttribute("aria-pressed", micLang === "tg" ? "true" : "false");
  $("#typeIn").placeholder = micLang === "ko" ? "한국어로 써도 돼요" : `${S.lang}로 써 봐요`;
}
$("#segKo").addEventListener("click", () => { micLang = "ko"; syncSeg(); });
$("#segTg").addEventListener("click", () => { micLang = "tg"; syncSeg(); });
$("#micBtn").addEventListener("click", () => {
  if (busy) return;
  listen(micLang === "ko" ? "ko-KR" : tgCode(), t => send(t));
});
$("#typeForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#typeIn").value; $("#typeIn").value = ""; send(v); });
$("#wrapBtn").addEventListener("click", () => wrapUp(false));

/* ---------- time limit ---------- */
setInterval(() => {
  if (!started || wrapped || document.hidden) return;
  usage.sec += 1;
  if (usage.sec % 10 === 0) store.set("kf.usage", usage);
  if (usage.sec % 30 === 0 && !busy) idleStatus();
  if (usage.sec >= Number(S.minutes) * 60 && !busy) wrapUp(true);
}, 1000);

/* ---------- settings ---------- */
const sel = $("#s_lang");
Object.keys(LANGS).forEach(k => { const o = document.createElement("option"); o.textContent = k; sel.append(o); });
function fillSheet(){
  $("#s_who").value = S.who; $("#s_age").value = S.age; $("#s_lang").value = S.lang; $("#s_level").value = S.level;
  $("#s_likes").value = S.likes; $("#s_friend").value = S.friend; $("#s_persona").value = S.persona;
  $("#s_repeat").value = S.repeatAmt; $("#s_min").value = S.minutes; $("#s_rate").value = S.rate; $("#rateV").textContent = Number(S.rate).toFixed(2);
  $("#s_sound").checked = !!S.soundFirst; $("#s_ko").checked = !!S.showKo;
  $("#s_key").value = S.apiKey; $("#s_model").value = S.model;
  $("#connClaude").hidden = provider !== "claude";
  $("#connGemini").hidden = provider === "claude" || provider === "none";
  clearArmed = false; $("#clearBtn").textContent = "기록 지우고 새로 시작";
}
function openSheet(){ fillSheet(); $("#sheetBg").hidden = false; }
function closeSheet(){ $("#sheetBg").hidden = true; }
$("#setBtn").addEventListener("click", openSheet);
$("#cancelBtn").addEventListener("click", closeSheet);
$("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") closeSheet(); });
$("#s_rate").addEventListener("input", e => { $("#rateV").textContent = Number(e.target.value).toFixed(2); });
let clearArmed = false;
$("#clearBtn").addEventListener("click", () => {
  if (!clearArmed){ clearArmed = true; $("#clearBtn").textContent = "한 번 더 누르면 지워져요"; return; }
  resetAll(); closeSheet();
});
$("#sheet").addEventListener("submit", e => {
  e.preventDefault();
  const langChanged = $("#s_lang").value !== S.lang;
  S = Object.assign(S, {
    who:$("#s_who").value, age:$("#s_age").value || S.age, lang:$("#s_lang").value, level:$("#s_level").value,
    likes:$("#s_likes").value.trim(), friend:$("#s_friend").value.trim() || "Emma", persona:$("#s_persona").value.trim() || "다정함",
    repeatAmt:$("#s_repeat").value, minutes:$("#s_min").value || "15", rate:Number($("#s_rate").value),
    soundFirst:$("#s_sound").checked, showKo:$("#s_ko").checked,
    apiKey:$("#s_key").value.trim(), model:$("#s_model").value.trim() || DEFAULTS.model
  });
  store.set("kf.settings", S);
  $("#fname").textContent = S.friend;
  syncSeg(); closeSheet(); renderAll(); idleStatus();
  if (langChanged && started && !wrapped) note(`이제 ${S.lang}로 이야기해요.`);
});

/* ---------- boot ---------- */
$("#fname").textContent = S.friend;
syncSeg(); renderAll(); idleStatus();
if (micBlocked) micHint(SR ? "키보드의 마이크로 말해요" : "글로 써 주세요");
detecting = (async () => {
  const c = window.claude;
  if (c && typeof c.use === "function"){
    try { sampleFn = await c.use("sample"); } catch(e){ sampleFn = null; }
    provider = sampleFn ? "claude" : "none";
  } else provider = "gemini";
  renderConn();
})();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
</script>
